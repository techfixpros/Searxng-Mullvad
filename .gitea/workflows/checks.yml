name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in *.sh; do bash -n "$f"; done
      # Errors fail the build; style and info findings are not enforced.
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -S error *.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the example compose file
        run: |
          cp docker-compose.yml.example docker-compose.yml
          cp active-mullvad.env.example active-mullvad.env
          docker compose config -q
